name: Build

on:
  push:
    branches: [ master ]
    tags: [ '*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Download FBX SDK
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force fbx | Out-Null
          Set-Location fbx
          Invoke-WebRequest "https://damassets.autodesk.net/content/dam/autodesk/www/adn/fbx/2020-2-1/fbx202021_fbxsdk_vs2019_win.exe" -OutFile "fbxsdk.exe"
          Start-Process -FilePath "fbxsdk.exe" -ArgumentList "/S" -Wait
          Invoke-WebRequest "https://damassets.autodesk.net/content/dam/autodesk/www/adn/fbx/2020-2-1/fbx202021_fbxsdk_vs2019_pdbs.exe" -OutFile "fbxpdb.exe"
          Start-Process -FilePath "fbxpdb.exe" -ArgumentList "/S" -Wait
          Set-Location ..

      - name: NuGet Restore
        run: nuget restore AssetStudio.sln

      - name: Build .NET Framework 4.7.2
        run: msbuild AssetStudio.sln /p:Configuration=Release /p:TargetFramework=net472 /verbosity:minimal

      - name: Build .NET 5 GUI
        run: msbuild AssetStudio.sln /t:AssetStudioGUI:publish /p:Configuration=Release /p:TargetFramework=net5.0-windows /p:SelfContained=false /verbosity:minimal

      - name: Build .NET 6 GUI
        run: msbuild AssetStudio.sln /t:AssetStudioGUI:publish /p:Configuration=Release /p:TargetFramework=net6.0-windows /p:SelfContained=false /verbosity:minimal

      - name: Build .NET 5 CLI
        run: msbuild AssetStudio.sln /t:AssetStudioCLI:publish /p:Configuration=Release /p:TargetFramework=net5.0-windows /p:SelfContained=false /verbosity:minimal

      - name: Build .NET 6 CLI
        run: msbuild AssetStudio.sln /t:AssetStudioCLI:publish /p:Configuration=Release /p:TargetFramework=net6.0-windows /p:SelfContained=false /verbosity:minimal

      - name: Upload .NET 4.7.2 GUI
        uses: actions/upload-artifact@v4
        with:
          name: net472-gui
          path: AssetStudioGUI/bin/Release/net472

      - name: Upload .NET 5 GUI
        uses: actions/upload-artifact@v4
        with:
          name: net5.0-windows-gui
          path: AssetStudioGUI/bin/Release/net5.0-windows/publish

      - name: Upload .NET 6 GUI
        uses: actions/upload-artifact@v4
        with:
          name: net6.0-windows-gui
          path: AssetStudioGUI/bin/Release/net6.0-windows/publish

      - name: Upload .NET 5 CLI
        uses: actions/upload-artifact@v4
        with:
          name: net5.0-windows-cli
          path: AssetStudioCLI/bin/Release/net5.0-windows/publish

      - name: Upload .NET 6 CLI
        uses: actions/upload-artifact@v4
        with:
          name: net6.0-windows-cli
          path: AssetStudioCLI/bin/Release/net6.0-windows/publish
